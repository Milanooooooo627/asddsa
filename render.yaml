services:
  - type: web
    name: proton-cloud-auth
    runtime: python
    rootDir: Cloud
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: proton-cloud-auth-db
          property: connectionString

databases:
  - name: proton-cloud-auth-db
    databaseName: protoncloud
    user: protoncloud
